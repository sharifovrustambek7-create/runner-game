<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Runner 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#menu{
 position:fixed;inset:0;z-index:10;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 50% 20%,rgba(30,130,255,.35),transparent 35%),
 linear-gradient(180deg,rgba(2,15,35,.2),rgba(2,8,18,.9));
}
.logo{text-align:center;margin-bottom:25px;text-shadow:0 5px 15px #000}
.logo .small{font-size:16px;font-weight:bold;letter-spacing:4px}
.logo h1{
 margin:3px 0;font-size:46px;line-height:.9;
 font-weight:1000;font-style:italic;
 color:#fff;
 text-shadow:0 4px 0 #1265c7,0 8px 18px #000;
}
.logo b{color:#ffd21c;font-size:34px;font-style:italic}
.btn{
 width:260px;height:58px;margin:7px;
 border:0;border-radius:18px;
 color:white;font-size:20px;font-weight:900;
 box-shadow:0 7px 15px rgba(0,0,0,.45);
}
.play{background:linear-gradient(180deg,#27df68,#0b9e45)}
.mission{background:linear-gradient(180deg,#ffbd25,#ee7700)}
.shop{background:linear-gradient(180deg,#c44dff,#7020d8)}
.characters{background:linear-gradient(180deg,#299dff,#1262dc)}

#hud{
 position:fixed;top:12px;left:0;right:0;z-index:5;
 display:none;justify-content:space-between;padding:0 12px;
}
.hudbox{
 background:rgba(3,15,35,.78);border:1px solid #287bd0;
 border-radius:16px;padding:9px 13px;font-weight:900;
 backdrop-filter:blur(8px)
}
#panels{
 position:fixed;inset:0;z-index:20;display:none;
 background:rgba(0,5,15,.9);align-items:center;justify-content:center;
 padding:20px;
}
.panel{
 width:min(430px,94vw);max-height:88vh;overflow:auto;
 background:linear-gradient(180deg,#071c39,#020a18);
 border:2px solid #2379d7;border-radius:24px;padding:18px;
 box-shadow:0 20px 60px #000;
}
.panel h2{margin:0 0 15px;text-align:center;font-size:28px}
.close{
 float:right;background:#162d4d;color:white;border:1px solid #4389d0;
 width:38px;height:38px;border-radius:50%;font-size:20px
}
.card{
 margin:10px 0;padding:15px;border-radius:16px;
 background:rgba(16,51,90,.7);border:1px solid #235f9e
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.buy{
 border:0;border-radius:12px;background:#19c85a;color:white;
 font-weight:900;padding:10px 16px
}
.char{
 display:inline-block;width:30%;margin:1%;
 padding:10px 4px;text-align:center;
 background:#09264a;border:1px solid #287bd0;border-radius:15px;
}
.avatar{font-size:48px}
#hint{
 position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 z-index:6;display:none;background:rgba(0,0,0,.65);
 padding:10px 18px;border-radius:20px;font-size:13px;
}
</style>
</head>
<body>

<div id="game"></div>

<div id="menu">
  <div class="logo">
    <div class="small">3D ENDLESS</div>
    <h1>STREET</h1>
    <b>RUNNER</b>
  </div>
  <button class="btn play" onclick="startGame()">▶ PLAY</button>
  <button class="btn mission" onclick="openPanel('missions')">🎯 MISSIONS</button>
  <button class="btn shop" onclick="openPanel('shop')">🛒 SHOP</button>
  <button class="btn characters" onclick="openPanel('characters')">👤 CHARACTERS</button>
</div>

<div id="hud">
  <div class="hudbox">🪙 <span id="coins">0</span></div>
  <div class="hudbox">🏆 <span id="score">0</span></div>
</div>

<div id="hint">← → YO‘NALISH • ↑ SAKRASH • ↓ SIRPANISH</div>

<div id="panels">
 <div class="panel">
   <button class="close" onclick="closePanels()">×</button>
   <div id="panelContent"></div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene,camera,renderer;
let player,road;
let running=false;
let lane=0;
let targetLane=0;
let speed=.32;
let distance=0;
let coinCount=0;
let score=0;
let objects=[];
let coins=[];
let clock;
let jumpY=0;
let jumping=false;
let sliding=false;
let slideTime=0;

const laneX=[-3,0,3];

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x07182c);
 scene.fog=new THREE.Fog(0x07182c,35,130);

 camera=new THREE.PerspectiveCamera(
   65,innerWidth/innerHeight,.1,250
 );
 camera.position.set(0,5.5,10);
 camera.lookAt(0,2,-25);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 document.getElementById("game").appendChild(renderer.domElement);

 const amb=new THREE.HemisphereLight(0x8fc8ff,0x172033,2);
 scene.add(amb);

 const light=new THREE.DirectionalLight(0xffffff,2);
 light.position.set(5,12,8);
 scene.add(light);

 createWorld();
 createPlayer();

 clock=new THREE.Clock();
 animate();

 addSwipe();
}

function mat(color){
 return new THREE.MeshStandardMaterial({color:color,roughness:.7});
}

function box(w,h,d,color){
 return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
}

function createWorld(){
 road=box(11,.3,220,0x202833);
 road.position.set(0,-.25,-55);
 scene.add(road);

 const sidewalk1=box(3,.45,220,0x39424c);
 sidewalk1.position.set(-7,-.1,-55);
 scene.add(sidewalk1);

 const sidewalk2=box(3,.45,220,0x39424c);
 sidewalk2.position.set(7,-.1,-55);
 scene.add(sidewalk2);

 for(let z=-5;z>-180;z-=10){
   for(const x of [-1.5,1.5]){
     const line=box(.18,.04,4,0xf7f7f7);
     line.position.set(x,.02,z);
     scene.add(line);
   }

   createBuilding(-11,z);
   createBuilding(11,z);
 }

 for(let i=0;i<35;i++){
   const c=createCoin();
   c.position.set(laneX[Math.floor(Math.random()*3)],1.2,-15-i*7);
   coins.push(c);
   scene.add(c);
 }

 for(let i=0;i<22;i++){
   const o=createObstacle();
   o.position.set(laneX[Math.floor(Math.random()*3)],.75,-28-i*10);
   objects.push(o);
   scene.add(o);
 }
}

function createBuilding(x,z){
 const h=5+Math.random()*12;
 const b=box(5,h,8,Math.random()>.5?0x152b45:0x1b2638);
 b.position.set(x,h/2-.2,z);
 scene.add(b);

 for(let y=1;y<h;y+=2){
   for(let xx=-1;xx<=1;xx++){
     const w=box(.35,.55,.08,0xffc94a);
     w.position.set(x+xx*1.3,y,z-4.04);
     scene.add(w);
   }
 }
}

function createPlayer(){
 player=new THREE.Group();

 const body=box(1.15,1.55,.7,0x0879e8);
 body.position.y=1.65;
 player.add(body);

 const head=new THREE.Mesh(
   new THREE.SphereGeometry(.52,20,20),mat(0xf0b27a)
 );
 head.position.y=2.8;
 player.add(head);

 const cap=box(1.05,.22,.85,0x101827);
 cap.position.set(0,3.25,0);
 player.add(cap);

 const leg1=box(.38,1.25,.42,0x101827);
 leg1.position.set(-.32,.55,0);
 player.add(leg1);

 const leg2=box(.38,1.25,.42,0x101827);
 leg2.position.set(.32,.55,0);
 player.add(leg2);

 const arm1=box(.3,1.2,.3,0x0879e8);
 arm1.position.set(-.75,1.65,0);
 arm1.rotation.z=-.18;
 player.add(arm1);

 const arm2=box(.3,1.2,.3,0x0879e8);
 arm2.position.set(.75,1.65,0);
 arm2.rotation.z=.18;
 player.add(arm2);

 player.position.set(0,0,4);
 scene.add(player);
}

function createCoin(){
 const c=new THREE.Mesh(
   new THREE.CylinderGeometry(.42,.42,.12,24),
   new THREE.MeshStandardMaterial({
     color:0xffc400,metalness:.8,roughness:.2
   })
 );
 c.rotation.z=Math.PI/2;
 return c;
}

function createObstacle(){
 const o=box(1.8,1.4,1,0xe34235);

 const stripe=box(1.9,.25,1.05,0xffffff);
 stripe.position.y=.2;
stripe.position.y=.2;
o.add(stripe);
return o;
}

function startGame(){
running=true;
distance=0;
score=0;
coinCount=0;
lane=0;
targetLane=0;

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="flex";
document.getElementById("hint").style.display="block";
resetObjects();
}

function resetObjects(){
objects.forEach((o,i)=>{
o.position.z=-28-i*10;
o.position.x=laneX[Math.floor(Math.random()*3)];
});

coins.forEach((c,i)=>{
c.position.z=-15-i*7;
c.position.x=laneX[Math.floor(Math.random()*3)];
});
}

function endGame(){
running=false;
document.getElementById("hud").style.display="none";
document.getElementById("hint").style.display="none";

setTimeout(()=>{
alert("O‘yin tugadi! 🏆 Ball: "+Math.floor(score)+"  🪙 Coin: "+coinCount);
document.getElementById("menu").style.display="flex";
},100);
}

function moveLeft(){
if(!running)return;
targetLane=Math.max(-1,targetLane-1);
}

function moveRight(){
if(!running)return;
targetLane=Math.min(1,targetLane+1);
}

function jump(){
if(!running||jumping)return;
jumping=true;
jumpY=0;
}

function slide(){
if(!running||sliding)return;
sliding=true;
slideTime=0;
player.scale.y=.55;
}

function animate(){
requestAnimationFrame(animate);

const dt=clock.getDelta();

if(running){
distance+=speed;
score+=speed*.35;

lane+=(targetLane-lane)*.15;
player.position.x=laneX[Math.round(lane)];

if(jumping){
jumpY+=dt*3.2;
player.position.y=Math.sin(jumpY)*2.2;

if(jumpY>=Math.PI){
jumping=false;
player.position.y=0;
}
}

if(sliding){
slideTime+=dt;
if(slideTime>.7){
sliding=false;
player.scale.y=1;
}
}

objects.forEach(o=>{
o.position.z+=speed;

if(o.position.z>12){
o.position.z=-190-Math.random()*40;
o.position.x=laneX[Math.floor(Math.random()*3)];
}

if(Math.abs(o.position.z-player.position.z)<1.25 &&
Math.abs(o.position.x-player.position.x)<1.1 &&
player.position.y<1.0 &&
!sliding){
endGame();
}
});

coins.forEach(c=>{
c.rotation.y+=.08;
c.position.z+=speed;

if(c.position.z>12){
c.position.z=-190-Math.random()*60;
c.position.x=laneX[Math.floor(Math.random()*3)];
}

if(Math.abs(c.position.z-player.position.z)<1.3 &&
Math.abs(c.position.x-player.position.x)<1){
coinCount++;
c.position.z=-190-Math.random()*60;
c.position.x=laneX[Math.floor(Math.random()*3)];
document.getElementById("coins").textContent=coinCount;
}
});

document.getElementById("score").textContent=Math.floor(score);
}

camera.position.x+=(player.position.x*.25-camera.position.x)*.05;
camera.position.y+=(5.5+player.position.y*.25-camera.position.y)*.05;
camera.lookAt(player.position.x*.15,2,-25);

renderer.render(scene,camera);
}

let sx=0,sy=0;

function addSwipe(){
renderer.domElement.addEventListener("touchstart",e=>{
const t=e.touches[0];
sx=t.clientX;
sy=t.clientY;
},{passive:true});

renderer.domElement.addEventListener("touchend",e=>{
const t=e.changedTouches[0];
const dx=t.clientX-sx;
const dy=t.clientY-sy;

if(Math.max(Math.abs(dx),Math.abs(dy))<35)return;

if(Math.abs(dx)>Math.abs(dy)){
if(dx<0)moveLeft();
else moveRight();
}else{
if(dy<0)jump();
else slide();
}
},{passive:true});
}

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")moveLeft();
if(e.key==="ArrowRight")moveRight();
if(e.key==="ArrowUp")jump();
if(e.key==="ArrowDown")slide();
});

function openPanel(type){
document.getElementById("panels").style.display="flex";

const p=document.getElementById("panelContent");

if(type==="missions"){
p.innerHTML=`
<h2>🎯 MISSIONS</h2>
<div class="card">🪙 20 ta coin yig‘ing<br>0 / 20<br>🏆 +50 coin</div>
<div class="card">🏃 500 metr yuguring<br>0 / 500<br>🏆 +100 coin</div>
<div class="card">🚧 10 ta to‘siqdan qoching<br>0 / 10<br>🏆 +150 coin</div>
<div class="card">⭐ 1 marta sakrang<br>0 / 1<br>🏆 +50 coin</div>`;
}

if(type==="shop"){
p.innerHTML=`
<h2>🛒 SHOP</h2>
<div class="card">
<div class="row">
<b>⚡ SPEED UPGRADE</b>
<button class="buy">100 🪙</button>
</div>
<small>Yugurish tezligini oshiradi</small>
</div>

<div class="card">
<div class="row">
<b>🪙 COIN MULTIPLIER</b>
<button class="buy">250 🪙</button>
</div>
<small>Ko‘proq coin olish imkoniyati</small>
</div>

<div class="card">
<div class="row">
<b>🛡️ SHIELD</b>
<button class="buy">300 🪙</button>
</div>
<small>Bir marta to‘qnashuvdan himoya</small>
</div>`;
}

if(type==="characters"){
p.innerHTML=`
<h2>👤 CHARACTERS</h2>

<div class="char">
<div class="avatar">🧢</div>
<b>STREET BOY</b><br>
<small>SELECTED</small>
</div>

<div class="char">
<div class="avatar">🤖</div>
<b>CYBER</b><br>
<button class="buy">SELECT</button>
</div>

<div class="char">
<div class="avatar">🥷</div>
<b>SHADOW</b><br>
<button class="buy">SELECT</button>
</div>`;
}
}

function closePanels(){
document.getElementById("panels").style.display="none";
}

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

init();
</script>

</body>
</html>
